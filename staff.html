<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麻媽家 店員後台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Noto Sans TC', sans-serif; background: #fff8f2; min-height: 100vh; }
  .header { background: linear-gradient(135deg, #cc6600, #FF8200); color: white; padding: 20px; text-align: center; }
  .header h1 { font-size: 20px; }
  .header .staff-info { font-size: 13px; opacity: 0.8; margin-top: 5px; }
  .header .logout-btn { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; }
  .section { padding: 20px; }
  .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .card h2 { font-size: 16px; color: #333; margin-bottom: 15px; }
  input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; margin-bottom: 10px; }
  .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; color: white; margin-bottom: 8px; }
  .btn-primary { background: #FF8200; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .result { padding: 15px; border-radius: 8px; margin-top: 10px; text-align: center; font-size: 16px; font-weight: bold; display: none; }
  .result.error { background: #f8d7da; color: #721c24; }
  .login-form { max-width: 400px; margin: 50px auto; }
  .coupon-result { background: #fff3e0; border: 2px solid #FF8200; border-radius: 12px; padding: 20px; text-align: center; margin-top: 15px; display: none; }
  .coupon-result .coupon-title { font-size: 20px; font-weight: bold; color: #FF8200; margin-bottom: 8px; }
  .coupon-result .coupon-desc { font-size: 14px; color: #666; margin-top: 8px; }
  .coupon-result .coupon-meta { display: flex; justify-content: center; gap: 16px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #f0c896; font-size: 12.5px; color: #997a4d; }
  .coupon-result .coupon-meta span { font-weight: bold; color: #cc6600; }
  .history-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
  .history-row:last-child { border-bottom: none; }
  .history-title { font-weight: bold; color: #333; }
  .history-sub { color: #999; font-size: 12px; margin-top: 2px; }
  .history-time { color: #999; font-size: 12px; text-align: right; white-space: nowrap; }
  .history-empty { text-align: center; color: #999; font-size: 13px; padding: 15px 0; }
  .refresh-btn { background: none; border: none; color: #FF8200; font-size: 12px; cursor: pointer; padding: 0; }
</style>
</head>
<body>

<div id="app"><div style="text-align:center;padding:50px;color:#999">載入中...</div></div>

<script>
const API = 'https://mamaja-member-api.renechen188.workers.dev';

let currentStaff = null;

function showLogin() {
  document.getElementById('app').innerHTML = `
    <div class="header"><h1>麻媽家 店員後台</h1></div>
    <div class="section">
      <div class="login-form card">
        <h2>店員登入</h2>
        <input type="text" id="username" placeholder="帳號">
        <input type="password" id="password" placeholder="密碼">
        <button class="btn btn-primary" onclick="login()">登入</button>
        <div id="login-error" style="color:#e74c3c;text-align:center;margin-top:10px;display:none">帳號或密碼錯誤</div>
      </div>
    </div>
  `;
}

async function login() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const res = await fetch(`${API}/api/staff/login`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });
  const data = await res.json();
  if (data.success) {
    currentStaff = data.staff;
    showMain();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}

function logout() {
  currentStaff = null;
  showLogin();
}

function showMain() {
  document.getElementById('app').innerHTML = `
    <div class="header" style="position:relative;">
      <button class="logout-btn" onclick="logout()">登出</button>
      <h1>麻媽家 店員後台</h1>
      <div class="staff-info">${currentStaff.name}｜${currentStaff.store}</div>
    </div>
    <div class="section">
      <div class="card">
        <h2>🎫 核銷優惠券</h2>
        <p style="font-size:13px;color:#999;margin-bottom:15px;">請客人出示會員卡上的核銷碼</p>
        <input type="text" id="coupon-code" placeholder="輸入核銷碼（6碼數字）" maxlength="6" inputmode="numeric" style="letter-spacing:3px;font-size:18px;text-align:center;">
        <button class="btn btn-primary" onclick="redeemCoupon()">確認核銷</button>
        <div class="coupon-result" id="coupon-result">
          <div class="coupon-title" id="coupon-title"></div>
          <div class="coupon-desc" id="coupon-desc"></div>
          <div style="margin-top:15px;font-size:13px;color:#27ae60;font-weight:bold">✅ 核銷成功！</div>
          <div class="coupon-meta">
            <div>核銷碼 <span id="coupon-meta-code"></span></div>
            <div>會員 <span id="coupon-meta-member"></span></div>
          </div>
        </div>
        <div class="result error" id="coupon-error"></div>
      </div>
      <div class="card">
        <h2 style="display:flex;justify-content:space-between;align-items:center;">
          <span>📋 本店核銷紀錄</span>
          <button class="refresh-btn" onclick="loadHistory()">重新整理</button>
        </h2>
        <div style="display:flex;gap:8px;margin-bottom:12px;">
          <input type="date" id="history-date" style="margin-bottom:0;flex:1;" onchange="loadHistory()">
          <button class="btn" style="width:auto;padding:0 16px;margin-bottom:0;background:#eee;color:#333;font-size:13px;" onclick="clearHistoryDate()">顯示最近</button>
        </div>
        <div id="history-list"><div class="history-empty">載入中...</div></div>
      </div>
    </div>
  `;
  document.getElementById('coupon-code').focus();
  loadHistory();
}

async function redeemCoupon() {
  const code = document.getElementById('coupon-code').value;
  if (!code || code.length < 6) { alert('請輸入完整核銷碼'); return; }

  const res = await fetch(`${API}/api/coupon/redeem`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code, staff: currentStaff.name, store: currentStaff.store })
  });
  const data = await res.json();

  const resultEl = document.getElementById('coupon-result');
  const errorEl = document.getElementById('coupon-error');

  if (data.success) {
    document.getElementById('coupon-title').textContent = data.coupon.title;
    document.getElementById('coupon-desc').textContent = data.coupon.description || '';
    document.getElementById('coupon-meta-code').textContent = data.coupon.code || code;
    const memberLabel = data.member?.name ? `${data.member.name}（${data.member.phone}）` : (data.member?.phone || '—');
    document.getElementById('coupon-meta-member').textContent = memberLabel;
    resultEl.style.display = 'block';
    errorEl.style.display = 'none';
    document.getElementById('coupon-code').value = '';
    loadHistory();
  } else {
    errorEl.textContent = data.error;
    errorEl.style.display = 'block';
    resultEl.style.display = 'none';
  }
}

function clearHistoryDate() {
  document.getElementById('history-date').value = '';
  loadHistory();
}

async function loadHistory() {
  const listEl = document.getElementById('history-list');
  const date = document.getElementById('history-date')?.value || '';
  const params = new URLSearchParams({ store: currentStaff.store });
  if (date) params.set('date', date);
  else params.set('limit', '20');

  try {
    const res = await fetch(`${API}/api/coupon/history?${params.toString()}`);
    const data = await res.json();
    const rows = data.history || [];

    if (rows.length === 0) {
      listEl.innerHTML = `<div class="history-empty">${date ? '這天沒有核銷紀錄' : '本店尚無核銷紀錄'}</div>`;
      return;
    }

    listEl.innerHTML = rows.map(r => {
      const memberLabel = r.member_name ? `${r.member_name}（${r.member_phone || ''}）` : (r.member_phone || '未知會員');
      const time = new Date(r.used_at).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      return `
        <div class="history-row">
          <div>
            <div class="history-title">${r.title}</div>
            <div class="history-sub">${memberLabel} ｜ 核銷碼 ${r.code}</div>
          </div>
          <div class="history-time">${time}</div>
        </div>`;
    }).join('');
  } catch (e) {
    listEl.innerHTML = '<div class="history-empty">載入失敗，請按重新整理</div>';
  }
}

showLogin();
</script>
</body>
</html>
