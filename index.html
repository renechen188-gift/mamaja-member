<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>麻媽家 會員中心</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --orange: #FF8200;
    --orange-dark: #CC6600;
    --orange-light: #FFF3E8;
    --cream: #F5F0EB;
    --text: #2A1A00;
    --muted: #8A7A6A;
    --border: #EDE5DC;

    /* 優惠券頂部循環配色：深咖 / 深綠 / 深紅 / 深藍 */
    --c-brown: #6B4423;
    --c-green: #2F5233;
    --c-red: #7A2E2E;
    --c-blue: #2C4A6B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--cream); }
  body { font-family: 'Noto Sans TC', sans-serif; max-width: 480px; margin: 0 auto; min-height: 100vh; }

  /* HEADER */
  .header {
    position: relative;
    z-index: 100;
  }
  .header-banner {
    width: 100%;
    display: block;
  }
  .header-member {
    position: absolute;
    top: 16px; right: 16px;
    text-align: right;
  }
  .header-member-label {
    color: rgba(255,255,255,0.65);
    font-size: 10px; margin-bottom: 2px;
  }
  .header-member-name {
    color: white; font-size: 14px; font-weight: 700;
    max-width: 160px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }

  /* TAB BAR */
  .tab-bar {
    background: white;
    display: flex;
    border-bottom: 1.5px solid var(--cream);
    position: sticky;
    top: 0;
    z-index: 99;
  }
  .tab {
    flex: 1; text-align: center;
    padding: 13px 0;
    font-size: 13px; color: #B0A090;
    cursor: pointer;
    border-bottom: 2.5px solid transparent;
    margin-bottom: -1.5px;
    transition: all 0.2s;
  }
  .tab.active {
    color: var(--orange);
    font-weight: 700;
    border-bottom-color: var(--orange);
  }

  /* TAB CONTENT */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* COUPON PAGE */
  .coupon-filter {
    padding: 14px 16px 8px;
    display: flex; gap: 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .coupon-filter::-webkit-scrollbar { display: none; }
  .filter-btn {
    background: white;
    color: #B0A090;
    font-size: 12px; font-weight: 500;
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn.active {
    background: var(--orange);
    color: white;
    border-color: var(--orange);
    font-weight: 700;
  }

  .coupon-list {
    padding: 6px 16px 100px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* COUPON CARD */
  .coupon-card {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .coupon-top {
    padding: 16px 20px 14px;
    position: relative;
  }
  /* 優惠券頂部循環配色（依序：深咖 → 深綠 → 深紅 → 深藍） */
  .coupon-top.brown { background: var(--c-brown); }
  .coupon-top.green { background: var(--c-green); }
  .coupon-top.red   { background: var(--c-red); }
  .coupon-top.blue  { background: var(--c-blue); }

  .coupon-label {
    color: rgba(255,255,255,0.7);
    font-size: 10px; letter-spacing: 2px;
    margin-bottom: 6px;
  }
  .coupon-amount {
    color: white;
    font-family: 'Noto Serif TC';
    font-size: 38px; font-weight: 700;
    line-height: 1;
  }
  .coupon-amount span {
    font-size: 16px; font-weight: 500;
    vertical-align: bottom; margin-left: 4px;
  }
  .coupon-status-badge {
    position: absolute;
    top: 16px; right: 18px;
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.4);
    padding: 5px 12px; border-radius: 20px;
    color: white; font-size: 11px;
  }
  .coupon-divider {
    height: 1px;
    background: repeating-linear-gradient(90deg, var(--border) 0, var(--border) 6px, transparent 6px, transparent 12px);
    margin: 0 16px;
    position: relative;
  }
  .coupon-divider::before, .coupon-divider::after {
    content: '';
    position: absolute;
    top: -10px;
    width: 20px; height: 20px;
    background: var(--cream);
    border-radius: 50%;
  }
  .coupon-divider::before { left: -26px; }
  .coupon-divider::after { right: -26px; }

  .coupon-bottom {
    padding: 13px 20px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .coupon-info-main {
    font-size: 12px; color: var(--muted);
    margin-bottom: 3px;
  }
  .coupon-info-expire {
    font-size: 11px; color: #C0B0A0;
  }
  .use-btn {
    background: var(--orange);
    color: white;
    font-size: 13px; font-weight: 700;
    padding: 9px 20px;
    border-radius: 22px;
    border: none;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.1s, opacity 0.1s;
    -webkit-appearance: none;
  }
  .use-btn:active { transform: scale(0.96); opacity: 0.9; }
  .coupon-btn-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
  }
  .online-btn {
    background: #4A90D9;
    font-size: 12px;
    padding: 7px 16px;
  }

  /* USED / EXPIRED STATE */
  .coupon-card.used .coupon-top,
  .coupon-card.expired .coupon-top {
    filter: grayscale(1);
    opacity: 0.55;
  }
  .coupon-card.used .coupon-bottom,
  .coupon-card.expired .coupon-bottom {
    opacity: 0.5;
  }
  .used-badge {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(-20deg);
    border: 3px solid rgba(255,255,255,0.6);
    color: rgba(255,255,255,0.7);
    font-size: 22px; font-weight: 900;
    padding: 4px 12px;
    border-radius: 4px;
    letter-spacing: 4px;
    pointer-events: none;
  }

  /* EMPTY STATE */
  .empty-card {
    background: white;
    border-radius: 16px;
    border: 1.5px dashed #E0D8D0;
    padding: 36px;
    text-align: center;
  }
  .empty-icon {
    font-size: 36px; margin-bottom: 12px; opacity: 0.25;
  }
  .empty-text {
    font-size: 14px; color: #C0B0A0; font-weight: 500;
    margin-bottom: 4px;
  }
  .empty-sub {
    font-size: 12px; color: #D0C8C0;
  }

  /* NOTICE BAR */
  .notice-bar {
    margin: 0 16px 24px;
    background: var(--orange-light);
    border-radius: 10px;
    padding: 12px 16px;
    border-left: 3px solid var(--orange);
    font-size: 12px;
    color: #7A4010;
    line-height: 1.7;
  }

  /* STAMP CAMPAIGNS */
  .activity-section {
    padding: 16px 16px 100px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .stamp-card {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .stamp-card-header {
    padding: 18px 20px 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .stamp-card-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .stamp-card-info { flex: 1; }
  .stamp-card-title {
    font-family: 'Noto Serif TC';
    font-size: 15px; font-weight: 700;
    color: var(--text);
    margin-bottom: 2px;
  }
  .stamp-card-desc {
    font-size: 12px; color: var(--muted);
    line-height: 1.5;
  }
  .stamp-card-date {
    font-size: 11px; color: #C0B0A0;
    margin-top: 2px;
  }
  .stamp-progress {
    padding: 0 20px 18px;
  }
  .stamp-dots {
    display: flex; gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .stamp-dot {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 2px dashed #D0C8C0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    color: #D0C8C0;
    transition: all 0.3s;
  }
  .stamp-dot.filled {
    border: 2px solid var(--orange);
    background: var(--orange-light);
    color: var(--orange);
  }
  .stamp-dot.reward-dot {
    border-color: #E8A040;
    color: #E8A040;
  }
  .stamp-dot.reward-dot.filled {
    background: #FFF8E8;
    border-color: #E8A040;
    color: #E8A040;
  }
  .stamp-bar {
    display: flex; justify-content: space-between; align-items: center;
  }
  .stamp-bar-text {
    font-size: 12px; color: var(--muted);
  }
  .stamp-bar-text strong {
    color: var(--orange); font-weight: 700;
  }
  .stamp-reward-info {
    font-size: 11px;
    color: #7A4010;
    background: var(--orange-light);
    padding: 8px 14px;
    border-radius: 8px;
    text-align: center;
  }
  .stamp-completed-badge {
    display: inline-block;
    background: var(--orange);
    color: white;
    font-size: 11px; font-weight: 700;
    padding: 3px 12px;
    border-radius: 20px;
  }

  /* PROFILE TAB */
  .profile-section {
    padding: 16px 16px 100px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .profile-card {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .profile-card-header {
    padding: 14px 18px;
    background: var(--orange-light);
    font-size: 12px; font-weight: 700;
    color: var(--orange-dark);
    letter-spacing: 1px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .profile-row {
    padding: 13px 18px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 0.5px solid var(--border);
    font-size: 14px;
  }
  .profile-row:last-child { border-bottom: none; }
  .profile-row-label { color: var(--muted); }
  .profile-row-value { color: var(--text); font-weight: 500; }
  .birthday-row {
    padding: 13px 18px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 0.5px solid var(--border);
    font-size: 14px;
    gap: 10px;
  }
  .birthday-input {
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 14px;
    font-family: 'Noto Sans TC';
    color: var(--text);
    background: var(--cream);
    width: 130px;
    text-align: center;
  }
  .birthday-input:focus { outline: none; border-color: var(--orange); }
  .birthday-save {
    background: var(--orange);
    color: white;
    font-size: 12px; font-weight: 700;
    padding: 7px 14px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    white-space: nowrap;
  }
  .birthday-save:disabled { opacity: 0.5; }
  .birthday-saved {
    font-size: 12px; color: #4CAF50; font-weight: 500;
    display: none;
  }

  /* MODAL (共用：核銷 / 註冊) */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white;
    border-radius: 24px 24px 0 0;
    padding: 28px 24px 40px;
    width: 100%; max-width: 480px;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-title {
    font-family: 'Noto Serif TC';
    font-size: 20px; font-weight: 700;
    color: var(--text); margin-bottom: 6px;
  }
  .modal-sub {
    font-size: 13px; color: var(--muted); margin-bottom: 24px;
  }
  .modal-code-box {
    background: var(--orange-light);
    border: 1.5px dashed var(--orange);
    border-radius: 14px;
    padding: 24px;
    text-align: center;
    margin-bottom: 20px;
  }
  .modal-code {
    font-size: 40px; font-weight: 900;
    color: var(--orange-dark);
    letter-spacing: 8px;
    font-family: monospace;
  }
  .modal-code-hint {
    font-size: 12px; color: var(--muted); margin-top: 10px;
  }
  .modal-expire {
    text-align: center;
    font-size: 12px; color: #C0B0A0;
    margin-bottom: 24px;
  }
  .modal-close {
    width: 100%;
    background: var(--orange);
    color: white; font-size: 15px; font-weight: 700;
    padding: 14px;
    border-radius: 30px; border: none;
    cursor: pointer;
    font-family: 'Noto Sans TC';
  }
  .modal-close:active { opacity: 0.9; }

  /* 註冊表單 */
  .modal.center { border-radius: 24px; }
  .form-label {
    font-size: 12px; color: var(--muted); font-weight: 700;
    margin: 16px 0 6px;
  }
  .form-label:first-of-type { margin-top: 0; }
  .form-input {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 13px 14px;
    font-size: 15px;
    font-family: 'Noto Sans TC';
    color: var(--text);
    background: var(--cream);
  }
  .form-input:focus { outline: none; border-color: var(--orange); }
  .form-error {
    display: none;
    color: #B23B3B;
    font-size: 12px;
    margin-top: 8px;
  }
  .form-hint {
    font-size: 11px; color: #C0B0A0; margin-top: 6px;
  }

  /* LOADING / ERROR SCREEN */
  .full-screen-state {
    position: fixed; inset: 0;
    background: var(--cream);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 300;
    padding: 40px;
    text-align: center;
  }
  .full-screen-state.hidden { display: none; }
  .spinner {
    width: 34px; height: 34px;
    border: 3px solid var(--border);
    border-top-color: var(--orange);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .state-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .state-sub { font-size: 12.5px; color: var(--muted); line-height: 1.7; }
  .retry-btn {
    margin-top: 18px;
    background: var(--orange);
    color: white; border: none;
    padding: 10px 24px; border-radius: 22px;
    font-size: 13px; font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>

<!-- LOADING -->
<div class="full-screen-state" id="loadingState">
  <div class="spinner"></div>
  <div class="state-title">會員資料載入中</div>
  <div class="state-sub">請稍候...</div>
</div>

<!-- ERROR -->
<div class="full-screen-state hidden" id="errorState">
  <div class="state-title">連線發生問題</div>
  <div class="state-sub" id="errorMsg">請確認網路連線後再試一次</div>
  <button class="retry-btn" onclick="location.reload()">重新載入</button>
</div>

<!-- MAIN APP (資料載入完成才顯示) -->
<div id="app" style="display:none;">

<!-- HEADER -->
<div class="header">
  <img class="header-banner" src="banner.jpg" alt="麻媽家">
  <div class="header-member">
    <div class="header-member-label">會員</div>
    <div class="header-member-name" id="memberName">—</div>
  </div>
</div>

<!-- TAB BAR -->
<div class="tab-bar">
  <div class="tab active" onclick="switchTab('coupon')">優惠券</div>
  <div class="tab" onclick="switchTab('activity')">活動</div>
  <div class="tab" onclick="switchTab('profile')">個人設定</div>
</div>

<!-- TAB: 優惠券 -->
<div class="tab-content active" id="tab-coupon">

  <div class="coupon-filter">
    <div class="filter-btn active" data-filter="usable" onclick="filterCoupon('usable', this)">可使用 (<span id="count-usable">0</span>)</div>
    <div class="filter-btn" data-filter="used" onclick="filterCoupon('used', this)">已使用 (<span id="count-used">0</span>)</div>
    <div class="filter-btn" data-filter="expired" onclick="filterCoupon('expired', this)">已過期 (<span id="count-expired">0</span>)</div>
  </div>

  <div class="coupon-list" id="list-usable"></div>
  <div class="coupon-list" id="list-used" style="display:none;"></div>
  <div class="coupon-list" id="list-expired" style="display:none;"></div>

</div>

<!-- TAB: 活動（集章活動） -->
<div class="tab-content" id="tab-activity">
  <div class="activity-section" id="stampList">
    <div class="empty-card">
      <div class="empty-icon">🎯</div>
      <div class="empty-text">目前沒有進行中的活動</div>
      <div class="empty-sub">請留意門市公告與 LINE 通知</div>
    </div>
  </div>
</div>

<!-- TAB: 個人設定 -->
<div class="tab-content" id="tab-profile">
  <div class="profile-section">

    <div class="profile-card">
      <div class="profile-card-header">基本資料</div>
      <div class="profile-row">
        <span class="profile-row-label">姓名</span>
        <span class="profile-row-value" id="profileName">—</span>
      </div>
      <div class="profile-row">
        <span class="profile-row-label">手機號碼</span>
        <span class="profile-row-value" id="profilePhone">—</span>
      </div>
      <div class="birthday-row">
        <span class="profile-row-label">生日</span>
        <div style="display:flex;align-items:center;gap:8px;">
          <input type="text" id="profileBirthday" class="birthday-input" placeholder="MM-DD" maxlength="5">
          <button class="birthday-save" id="birthdaySaveBtn" onclick="saveBirthday()">儲存</button>
          <span class="birthday-saved" id="birthdaySaved">已儲存</span>
        </div>
      </div>
      <div class="profile-row">
        <span class="profile-row-label">加入日期</span>
        <span class="profile-row-value" id="profileJoinDate">—</span>
      </div>
    </div>

    <div class="notice-bar" style="margin:0;">
      優惠券出示給店員核銷後即無法復原，請於效期內盡快使用。
    </div>
  </div>
</div>

</div><!-- /#app -->

<!-- 註冊 MODAL -->
<div class="modal-overlay" id="registerModal" style="align-items:center;">
  <div class="modal center">
    <div class="modal-title">加入麻媽家會員</div>
    <div class="modal-sub">完成註冊即可獲得 3 張迎新優惠券</div>

    <div class="form-label">姓名</div>
    <input type="text" id="reg-name" class="form-input" placeholder="您的稱呼（選填）">

    <div class="form-label">手機號碼</div>
    <input type="tel" id="reg-phone" class="form-input" placeholder="請輸入手機號碼" maxlength="10">
    <div class="form-hint">用於門市核對會員身份，請務必填寫</div>

    <div class="form-error" id="reg-error"></div>

    <button class="modal-close" style="margin-top:20px;" onclick="submitRegister()" id="reg-submit-btn">完成加入</button>
  </div>
</div>

<!-- 核銷 MODAL -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title" id="modal-title">優惠券</div>
    <div class="modal-sub" id="modal-sub">出示此頁面給店員確認核銷</div>
    <div class="modal-code-box">
      <div class="modal-code" id="modal-code">------</div>
      <div class="modal-code-hint">請店員輸入此核銷碼完成核銷</div>
    </div>
    <div class="modal-expire" id="modal-expire"></div>
    <button class="modal-close" onclick="closeModalDirect()">關閉</button>
  </div>
</div>

<script>
const API = 'https://mamaja-member-api.renechen188.workers.dev';
const LIFF_ID = '2006569520-JIW00lVU';
const COUPON_COLORS = ['brown', 'green', 'red', 'blue'];

let lineProfile = null;
let currentMember = null;
let currentCoupons = [];
let currentCampaigns = [];

/* ---------- 啟動流程 ---------- */

async function initApp() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }
    lineProfile = await liff.getProfile();
    await loadMember();
  } catch (err) {
    console.error(err);
    showError('LIFF 初始化失敗，請確認是否從 LINE 內開啟本頁面。');
  }
}

async function loadMember() {
  try {
    const res = await fetch(`${API}/api/member/points?line_id=${encodeURIComponent(lineProfile.userId)}`);
    if (res.status === 404) {
      showRegisterModal();
      return;
    }
    if (!res.ok) throw new Error('伺服器錯誤 (' + res.status + ')');
    const data = await res.json();
    currentMember = data.member;
    currentCoupons = data.coupons || [];
    await loadStampCampaigns();
    renderApp();
  } catch (err) {
    console.error(err);
    showError('無法讀取會員資料，請檢查網路連線後重試。');
  }
}

function showError(msg) {
  document.getElementById('loadingState').classList.add('hidden');
  document.getElementById('errorMsg').textContent = msg;
  document.getElementById('errorState').classList.remove('hidden');
}

/* ---------- 註冊 ---------- */

function showRegisterModal() {
  document.getElementById('loadingState').classList.add('hidden');
  document.getElementById('reg-name').value = (lineProfile && lineProfile.displayName) || '';
  document.getElementById('registerModal').classList.add('open');
}

async function submitRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const phone = document.getElementById('reg-phone').value.trim();
  const errorEl = document.getElementById('reg-error');
  errorEl.style.display = 'none';

  if (!/^09\d{8}$/.test(phone)) {
    errorEl.textContent = '請輸入正確的手機號碼格式（例：0912345678）';
    errorEl.style.display = 'block';
    return;
  }

  const btn = document.getElementById('reg-submit-btn');
  btn.disabled = true;
  btn.textContent = '處理中...';

  try {
    const res = await fetch(`${API}/api/member`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ line_id: lineProfile.userId, name: name || lineProfile.displayName, phone })
    });
    if (!res.ok) throw new Error('註冊失敗');
    document.getElementById('registerModal').classList.remove('open');
    document.getElementById('loadingState').classList.remove('hidden');
    await loadMember();
  } catch (err) {
    console.error(err);
    errorEl.textContent = '註冊失敗，請稍後再試';
    errorEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = '完成加入';
  }
}

/* ---------- 主畫面渲染 ---------- */

function renderApp() {
  document.getElementById('loadingState').classList.add('hidden');
  document.getElementById('app').style.display = 'block';

  const displayName = currentMember.name || (lineProfile && lineProfile.displayName) || '會員';
  document.getElementById('memberName').textContent = displayName;
  document.getElementById('profileName').textContent = displayName;
  document.getElementById('profilePhone').textContent = currentMember.phone || '未填寫';
  document.getElementById('profileJoinDate').textContent = formatDate(currentMember.created_at);

  const birthdayInput = document.getElementById('profileBirthday');
  const birthdayBtn = document.getElementById('birthdaySaveBtn');
  const birthdaySaved = document.getElementById('birthdaySaved');
  if (currentMember.birthday) {
    birthdayInput.value = currentMember.birthday;
    birthdayInput.readOnly = true;
    birthdayInput.style.borderColor = '#4CAF50';
    birthdayBtn.style.display = 'none';
    birthdaySaved.style.display = 'inline';
  }

  renderCoupons();
  renderStamps();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

function renderCoupons() {
  const now = new Date();
  const usable = [];
  const used = [];
  const expired = [];

  currentCoupons.forEach(c => {
    const isPastExpiry = new Date(c.expires_at) < now;
    if (c.status === 'used') used.push(c);
    else if (c.status === 'expired' || (c.status === 'active' && isPastExpiry)) expired.push(c);
    else usable.push(c);
  });

  document.getElementById('count-usable').textContent = usable.length;
  document.getElementById('count-used').textContent = used.length;
  document.getElementById('count-expired').textContent = expired.length;

  renderCouponList('list-usable', usable, 'usable');
  renderCouponList('list-used', used, 'used');
  renderCouponList('list-expired', expired, 'expired');
}

function renderCouponList(containerId, coupons, state) {
  const container = document.getElementById(containerId);

  if (coupons.length === 0) {
    container.innerHTML = `
      <div class="empty-card">
        <div class="empty-icon">🎫</div>
        <div class="empty-text">${state === 'usable' ? '目前沒有可使用的優惠券' : state === 'used' ? '尚無使用紀錄' : '沒有過期券'}</div>
        <div class="empty-sub">請留意門市公告與 LINE 通知</div>
      </div>`;
    return;
  }

  container.innerHTML = coupons.map((c, i) => couponCardHTML(c, i, state)).join('')
    + (state === 'usable' ? `
      <div class="notice-bar">
        到店消費：點擊「到店使用」出示核銷碼給店員。線上點餐：點擊「線上使用」複製券碼，貼到點餐備註欄。每次消費限用一張，核銷後無法復原。
      </div>` : '');

  if (state === 'usable') {
    container.querySelectorAll('.use-btn:not(.online-btn)').forEach(btn => {
      btn.addEventListener('click', () => {
        const coupon = currentCoupons.find(c => c.id == btn.dataset.id);
        if (coupon) openRedeemModal(coupon);
      });
    });
    container.querySelectorAll('.online-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const code = btn.dataset.code;
        const coupon = currentCoupons.find(c => c.id == btn.dataset.id);
        navigator.clipboard.writeText(code).then(() => {
          alert(`券碼 ${code} 已複製！\n\n請到線上點餐頁面，在備註欄貼上此券碼：${code}\n\n店員確認後會為您附上：${coupon ? coupon.description : '贈品'}`);
        }).catch(() => {
          prompt('請複製此券碼，貼到點餐備註欄：', code);
        });
      });
    });
  }
}

function couponCardHTML(c, idx, state) {
  const colorClass = COUPON_COLORS[idx % COUPON_COLORS.length];
  const title = escapeHtml(c.title);
  const desc = escapeHtml(c.description || '');
  const expireText = state === 'expired'
    ? `有效期限：${formatDate(c.expires_at)}（已過期）`
    : `有效期限：${formatDate(c.expires_at)}`;

  const isGift = c.type === 'gift' || c.discount === 0;
  const amountHTML = isGift
    ? `<div class="coupon-amount">🎁 <span>贈品</span></div>`
    : `<div class="coupon-amount">$${c.discount} <span>折抵</span></div>`;

  if (state === 'usable') {
    return `
    <div class="coupon-card">
      <div class="coupon-top ${colorClass}">
        <div class="coupon-label">${title}</div>
        ${amountHTML}
        <div class="coupon-status-badge">未使用</div>
      </div>
      <div class="coupon-divider"></div>
      <div class="coupon-bottom">
        <div>
          <div class="coupon-info-main">${desc}</div>
          <div class="coupon-info-expire">${expireText}</div>
        </div>
        <div class="coupon-btn-group">
          <button class="use-btn" data-id="${c.id}">到店使用</button>
          <button class="use-btn online-btn" data-id="${c.id}" data-code="${c.code}">線上使用</button>
        </div>
      </div>
    </div>`;
  }

  const badgeText = state === 'used' ? '已使用' : '已過期';
  const bottomInfo = state === 'used'
    ? `${escapeHtml(c.used_store || '')}　${formatDate(c.used_at)} 使用`
    : desc;

  const amountHTMLInactive = isGift
    ? `<div class="coupon-amount">🎁 <span>贈品</span></div>`
    : `<div class="coupon-amount">$${c.discount} <span>折抵</span></div>`;

  return `
    <div class="coupon-card ${state}">
      <div class="coupon-top ${colorClass}" style="position:relative;">
        <div class="coupon-label">${title}</div>
        ${amountHTMLInactive}
        <div class="used-badge">${badgeText}</div>
      </div>
      <div class="coupon-divider"></div>
      <div class="coupon-bottom">
        <div>
          <div class="coupon-info-main">${bottomInfo}</div>
          <div class="coupon-info-expire">${expireText}</div>
        </div>
      </div>
    </div>`;
}

/* ---------- Tabs / Filter ---------- */

function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    const names = ['coupon','activity','profile'];
    t.classList.toggle('active', names[i] === name);
  });
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
}

function filterCoupon(type, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  ['usable','used','expired'].forEach(t => {
    document.getElementById('list-' + t).style.display = t === type ? 'flex' : 'none';
  });
}

/* ---------- 核銷 MODAL（顯示真實核銷碼） ---------- */

function openRedeemModal(coupon) {
  document.getElementById('modal-title').textContent = `${coupon.title}`;
  document.getElementById('modal-sub').textContent = '出示此頁面給店員確認核銷';
  document.getElementById('modal-code').textContent = coupon.code;
  document.getElementById('modal-expire').textContent = '有效期限至 ' + formatDate(coupon.expires_at);
  document.getElementById('modal').classList.add('open');
}

function closeModal(e) {
  if (e.target.id === 'modal') closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modal').classList.remove('open');
}

/* ---------- 集章活動 ---------- */

async function loadStampCampaigns() {
  try {
    const res = await fetch(`${API}/api/stamp/active?line_id=${encodeURIComponent(lineProfile.userId)}`);
    if (res.ok) {
      const data = await res.json();
      currentCampaigns = data.campaigns || [];
    }
  } catch (e) {
    console.error('載入集章活動失敗', e);
    currentCampaigns = [];
  }
}

function renderStamps() {
  const container = document.getElementById('stampList');
  if (currentCampaigns.length === 0) {
    container.innerHTML = `
      <div class="empty-card">
        <div class="empty-icon">🎯</div>
        <div class="empty-text">目前沒有進行中的活動</div>
        <div class="empty-sub">請留意門市公告與 LINE 通知</div>
      </div>`;
    return;
  }

  container.innerHTML = currentCampaigns.map(c => {
    const myStamps = c.my_stamps || 0;
    const goal = c.stamp_goal;
    const completed = myStamps >= goal;
    const icon = escapeHtml(c.icon || '🍲');
    const color = c.color || '#FF8200';

    let dotsHTML = '';
    for (let i = 1; i <= goal; i++) {
      const isLast = i === goal;
      const isFilled = i <= myStamps;
      const cls = isLast ? 'stamp-dot reward-dot' : 'stamp-dot';
      const filledCls = isFilled ? ' filled' : '';
      const inner = isFilled ? '✓' : (isLast ? '🎁' : i);
      dotsHTML += `<div class="${cls}${filledCls}">${inner}</div>`;
    }

    const dateRange = `${c.start_date} ~ ${c.end_date}`;

    return `
    <div class="stamp-card">
      <div class="stamp-card-header">
        <div class="stamp-card-icon" style="background:${color}20;color:${color};">${icon}</div>
        <div class="stamp-card-info">
          <div class="stamp-card-title">${escapeHtml(c.title)}</div>
          <div class="stamp-card-desc">${escapeHtml(c.description || '')}</div>
          <div class="stamp-card-date">${dateRange}</div>
        </div>
      </div>
      <div class="stamp-progress">
        <div class="stamp-dots">${dotsHTML}</div>
        <div class="stamp-bar">
          <div class="stamp-bar-text">進度 <strong>${myStamps}/${goal}</strong></div>
          ${completed
            ? '<span class="stamp-completed-badge">已集滿</span>'
            : `<div class="stamp-reward-info">集滿獎勵：${escapeHtml(c.reward_title || '')}</div>`}
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ---------- 生日儲存 ---------- */

async function saveBirthday() {
  const input = document.getElementById('profileBirthday');
  const btn = document.getElementById('birthdaySaveBtn');
  const saved = document.getElementById('birthdaySaved');
  const val = input.value.trim();

  if (!/^\d{2}-\d{2}$/.test(val)) {
    alert('請輸入正確格式 MM-DD（例：08-15）');
    return;
  }
  const mm = parseInt(val.split('-')[0]);
  const dd = parseInt(val.split('-')[1]);
  if (mm < 1 || mm > 12 || dd < 1 || dd > 31) {
    alert('請輸入有效的月日');
    return;
  }

  btn.disabled = true;
  btn.textContent = '儲存中…';
  try {
    const res = await fetch(`${API}/api/member/update`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ line_id: lineProfile.userId, birthday: val })
    });
    if (!res.ok) throw new Error('儲存失敗');
    const data = await res.json();
    currentMember = data;
    btn.style.display = 'none';
    saved.style.display = 'inline';
    input.readOnly = true;
    input.style.borderColor = '#4CAF50';
  } catch (e) {
    alert('儲存失敗，請稍後再試');
  } finally {
    btn.disabled = false;
    btn.textContent = '儲存';
  }
}

/* ---------- 啟動 ---------- */
window.addEventListener('DOMContentLoaded', initApp);
</script>
