<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麻媽家 LINE 會員管理後台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Noto Sans TC', sans-serif; background: #f5f5f5; min-height: 100vh; }
  .header { background: linear-gradient(135deg, #cc6600, #FF8200); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
  .header h1 { font-size: 18px; }
  .header .logout { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; }
  .stat-card { background: white; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .stat-card .num { font-size: 28px; font-weight: bold; color: #FF8200; }
  .stat-card .label { font-size: 12px; color: #999; margin-top: 5px; }
  .section { padding: 0 20px 20px; }
  .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; }
  .card h2 { font-size: 15px; margin-bottom: 12px; }
  input, select, textarea { width: 100%; padding: 11px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 10px; font-family: inherit; }
  textarea { resize: vertical; min-height: 60px; }
  .btn { padding: 12px 20px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; color: white; width: 100%; margin-bottom: 8px; }
  .btn-primary { background: #FF8200; }
  .btn-success { background: #27ae60; }
  .btn-danger { background: #e74c3c; }
  .btn-sm { padding: 6px 12px; font-size: 12px; width: auto; margin: 0; }
  .btn:disabled { opacity: 0.5; }
  .tab { display: flex; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin: 0 20px 20px; flex-wrap: wrap; }
  .tab-btn { flex: 1; min-width: 55px; padding: 12px 3px; border: none; background: white; cursor: pointer; font-size: 11px; text-align: center; }
  .tab-btn.active { background: #FF8200; color: white; }
  .member-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
  .member-row:last-child { border-bottom: none; }
  .member-row .info .name { font-size: 15px; font-weight: bold; }
  .member-row .info .detail { font-size: 12px; color: #999; margin-top: 3px; }
  .store-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
  .store-row:last-child { border-bottom: none; }
  .login-wrap { max-width: 400px; margin: 80px auto; padding: 0 20px; }
  .btn-login { width: 100%; padding: 14px; background: #FF8200; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
  .error { color: #e74c3c; text-align: center; margin-top: 10px; display: none; font-size: 14px; }
  .loading { text-align: center; padding: 30px; color: #999; }
  .result { padding: 15px; border-radius: 8px; margin-top: 10px; text-align: center; font-weight: bold; display: none; }
  .result.success { background: #d4edda; color: #155724; }
  .result.error { background: #f8d7da; color: #721c24; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .badge-active { background: #e8f5e9; color: #27ae60; }
  .badge-used { background: #f5f5f5; color: #999; }
  .badge-expired { background: #fce4ec; color: #e74c3c; }
  .tag-chip { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; margin: 2px 4px 2px 0; color: white; }
  .tag-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
  .tag-row:last-child { border-bottom: none; }
  .campaign-card { background: #fff8f2; border-radius: 10px; padding: 15px; margin-bottom: 12px; border: 1px solid #ede5dc; }
  .campaign-card .c-title { font-size: 15px; font-weight: bold; }
  .campaign-card .c-info { font-size: 12px; color: #999; margin-top: 4px; }
  .campaign-card .c-stats { display: flex; gap: 15px; margin-top: 8px; font-size: 13px; }
  .campaign-card .c-stats span { color: #FF8200; font-weight: bold; }
  .form-row { display: flex; gap: 10px; }
  .form-row > * { flex: 1; }
</style>
</head>
<body>

<div id="app"><div class="loading">載入中...</div></div>

<script>
const API = 'https://mamaja-member-api.renechen188.workers.dev';
let currentTab = 'overview';
let allTags = [];

function showLogin() {
  document.getElementById('app').innerHTML = `
    <div style="background:linear-gradient(135deg,#cc6600,#FF8200);padding:40px 20px;text-align:center;color:white;">
      <h1 style="font-size:22px;">麻媽家</h1>
      <p style="opacity:0.8;margin-top:5px;">LINE 會員管理後台</p>
    </div>
    <div class="login-wrap">
      <div class="card">
        <h2 style="margin-bottom:20px;">管理員登入</h2>
        <input type="text" id="username" placeholder="帳號">
        <input type="password" id="password" placeholder="密碼">
        <button class="btn-login" onclick="login()">登入</button>
        <div class="error" id="err">帳號或密碼錯誤，或權限不足</div>
      </div>
    </div>
  `;
}

async function login() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const res = await fetch(`${API}/api/staff/login`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });
  const data = await res.json();
  if (data.success && data.staff.role === 'admin') {
    showAdmin();
  } else {
    document.getElementById('err').style.display = 'block';
  }
}

async function showAdmin() {
  document.getElementById('app').innerHTML = `
    <div class="header">
      <h1>麻媽家 管理後台</h1>
      <button class="logout" onclick="showLogin()">登出</button>
    </div>
    <div class="tab" style="margin-top:20px;">
      <button class="tab-btn active" onclick="switchTab('overview')" id="tab-overview">📊 總覽</button>
      <button class="tab-btn" onclick="switchTab('members')" id="tab-members">👥 會員</button>
      <button class="tab-btn" onclick="switchTab('tags')" id="tab-tags">🏷️ 標籤</button>
      <button class="tab-btn" onclick="switchTab('send')" id="tab-send">🎫 發券</button>
      <button class="tab-btn" onclick="switchTab('stamps')" id="tab-stamps">🎯 集章</button>
      <button class="tab-btn" onclick="switchTab('scratch')" id="tab-scratch">🎰 刮刮卡</button>
      <button class="tab-btn" onclick="switchTab('wheel')" id="tab-wheel">🎡 轉盤</button>
      <button class="tab-btn" onclick="switchTab('coupons')" id="tab-coupons">📋 券紀錄</button>
      <button class="tab-btn" onclick="switchTab('export')" id="tab-export">📤 匯出</button>
    </div>
    <div id="tab-content"></div>
  `;
  await loadOverview();
}

async function switchTab(tab) {
  currentTab = tab;
  ['overview','members','tags','send','stamps','scratch','wheel','coupons','export'].forEach(t => {
    document.getElementById(`tab-${t}`).className = 'tab-btn' + (t === tab ? ' active' : '');
  });
  if (tab === 'overview') await loadOverview();
  if (tab === 'members') await loadMembers();
  if (tab === 'tags') await loadTags();
  if (tab === 'send') await showSendCoupon();
  if (tab === 'stamps') await loadStampCampaigns();
  if (tab === 'scratch') await loadScratchCampaigns();
  if (tab === 'wheel') await loadWheelCampaigns();
  if (tab === 'coupons') await loadCoupons();
  if (tab === 'export') showExport();
}

// ── 總覽 ──

async function loadOverview() {
  document.getElementById('tab-content').innerHTML = '<div class="loading">載入中...</div>';
  const res = await fetch(`${API}/api/admin/stats`);
  const data = await res.json();
  if (data.error) { document.getElementById('tab-content').innerHTML = '<div class="loading">載入失敗</div>'; return; }

  const storeHTML = data.stores.map(s => `
    <div class="store-row">
      <div>${s.store || '未知'}</div>
      <div style="font-weight:bold;color:#FF8200">${s.count} 人</div>
    </div>
  `).join('');

  const tagHTML = (data.tagStats || []).map(t => `
    <div class="store-row">
      <div>${t.tag}</div>
      <div style="font-weight:bold;color:#FF8200">${t.count} 人</div>
    </div>
  `).join('');

  document.getElementById('tab-content').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="num">${data.totalMembers}</div><div class="label">總會員數</div></div>
      <div class="stat-card"><div class="num">${data.birthdayFilled || 0}</div><div class="label">已填生日</div></div>
      <div class="stat-card"><div class="num">${data.activeCoupons}</div><div class="label">待使用優惠券</div></div>
      <div class="stat-card"><div class="num">${data.usedCoupons}</div><div class="label">已核銷券數</div></div>
    </div>
    <div class="section">
      <div class="card">
        <h2>各門店會員數</h2>
        ${storeHTML || '<p style="color:#999">尚無資料</p>'}
      </div>
      ${tagHTML ? `<div class="card"><h2>標籤統計</h2>${tagHTML}</div>` : ''}
    </div>
  `;
}

// ── 會員列表 ──

let allMembers = [];

async function loadMembers() {
  document.getElementById('tab-content').innerHTML = '<div class="loading">載入中...</div>';
  const [membersRes, tagsRes] = await Promise.all([
    fetch(`${API}/api/admin/members`),
    fetch(`${API}/api/admin/tags`)
  ]);
  const membersData = await membersRes.json();
  const tagsData = await tagsRes.json();
  allMembers = membersData.members || [];
  allTags = tagsData.tags || [];

  const memberHTML = allMembers.map(m => {
    const memberTags = m.tags || [];
    const tagsHTML = memberTags.map(t => {
      const tagDef = allTags.find(at => at.name === t);
      const color = tagDef ? tagDef.color : '#FF8200';
      return `<span class="tag-chip" style="background:${color}">${t} <span style="cursor:pointer;margin-left:2px;" onclick="removeTag(${m.id},'${t}')">✕</span></span>`;
    }).join('');

    const availableTags = allTags.filter(t => !memberTags.includes(t.name));
    const addOptions = availableTags.map(t => `<option value="${t.name}">${t.name}</option>`).join('');

    return `
    <div style="padding:12px 0;border-bottom:1px solid #f0f0f0;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <div style="font-size:15px;font-weight:bold;">${m.name || '未命名'}</div>
          <div style="font-size:12px;color:#999;margin-top:3px;">${m.phone || ''} ｜ 生日 ${m.birthday || '未填'} ｜ ${new Date(m.created_at).toLocaleDateString('zh-TW')}</div>
        </div>
      </div>
      <div style="margin-top:6px;display:flex;align-items:center;flex-wrap:wrap;gap:4px;">
        ${tagsHTML}
        ${availableTags.length > 0 ? `
          <select id="add-tag-${m.id}" style="width:auto;padding:4px 8px;font-size:11px;margin:0;border-radius:12px;">
            <option value="">+標籤</option>
            ${addOptions}
          </select>
          <button class="btn btn-primary btn-sm" onclick="addTagToMember(${m.id})">加</button>
        ` : ''}
      </div>
    </div>`;
  }).join('');

  document.getElementById('tab-content').innerHTML = `
    <div class="section" style="padding-top:20px;">
      <div class="card">
        <h2>所有會員（${allMembers.length} 人）</h2>
        ${memberHTML || '<p style="color:#999;text-align:center;padding:20px;">尚無會員</p>'}
      </div>
    </div>
  `;
}

async function addTagToMember(memberId) {
  const select = document.getElementById(`add-tag-${memberId}`);
  const tag = select.value;
  if (!tag) return;

  await fetch(`${API}/api/admin/member-tag`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ member_ids: [memberId], tag })
  });
  await loadMembers();
}

async function removeTag(memberId, tag) {
  if (!confirm(`移除「${tag}」標籤？`)) return;
  await fetch(`${API}/api/admin/member-tag`, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ member_ids: [memberId], tag })
  });
  await loadMembers();
}

// ── 標籤管理 ──

async function loadTags() {
  document.getElementById('tab-content').innerHTML = '<div class="loading">載入中...</div>';
  const res = await fetch(`${API}/api/admin/tags`);
  const data = await res.json();
  allTags = data.tags || [];

  const tagListHTML = allTags.map(t => `
    <div class="tag-row">
      <div>
        <span class="tag-chip" style="background:${t.color}">${t.name}</span>
        <span style="font-size:12px;color:#999;margin-left:4px">${t.type === 'auto' ? '自動' : '手動'} ｜ ${t.member_count} 人</span>
      </div>
      ${t.type === 'manual' ? `<button class="btn btn-danger btn-sm" onclick="deleteTag('${t.name}')">刪除</button>` : ''}
    </div>
  `).join('');

  document.getElementById('tab-content').innerHTML = `
    <div class="section" style="padding-top:20px;">
      <div class="card">
        <h2>新增標籤</h2>
        <div class="form-row">
          <input type="text" id="tag-name" placeholder="標籤名稱" style="flex:2">
          <input type="color" id="tag-color" value="#FF8200" style="flex:0.5;padding:5px;height:43px;">
        </div>
        <button class="btn btn-primary" onclick="addTag()">新增標籤</button>
      </div>
      <div class="card">
        <h2>自動標籤</h2>
        <p style="font-size:13px;color:#999;margin-bottom:12px">自動判斷：新會員（30天內）、壽星月（當月生日）、沉睡客（60天未用券）</p>
        <button class="btn btn-success" onclick="runAutoTag()">執行自動標籤</button>
        <div class="result" id="auto-tag-result"></div>
      </div>
      <div class="card">
        <h2>現有標籤</h2>
        ${tagListHTML || '<p style="color:#999">尚無標籤</p>'}
      </div>
    </div>
  `;
}

async function addTag() {
  const name = document.getElementById('tag-name').value.trim();
  const color = document.getElementById('tag-color').value;
  if (!name) return alert('請輸入標籤名稱');

  await fetch(`${API}/api/admin/tags`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, color })
  });
  await loadTags();
}

async function deleteTag(name) {
  if (!confirm(`確定刪除標籤「${name}」？已貼此標籤的會員會自動移除`)) return;
  await fetch(`${API}/api/admin/tags`, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name })
  });
  await loadTags();
}

async function runAutoTag() {
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = '執行中...';

  const res = await fetch(`${API}/api/admin/auto-tag`, { method: 'POST' });
  const data = await res.json();
  const el = document.getElementById('auto-tag-result');
  el.style.display = 'block';

  if (data.success) {
    const details = (data.auto_tags || []).map(t => `${t.tag}: ${t.count} 人`).join('、');
    el.className = 'result success';
    el.innerHTML = `✅ 自動標籤完成！${details || '無符合條件的會員'}`;
  } else {
    el.className = 'result error';
    el.innerHTML = '執行失敗';
  }

  btn.disabled = false;
  btn.textContent = '執行自動標籤';
}

// ── 發券（支援標籤篩選）──

let couponTemplates = [];

async function showSendCoupon() {
  const [tagsRes, couponsRes] = await Promise.all([
    fetch(`${API}/api/admin/tags`),
    fetch(`${API}/api/admin/coupons`)
  ]);
  const tagsData = await tagsRes.json();
  const couponsData = await couponsRes.json();
  allTags = tagsData.tags || [];

  // 從歷史券建立模板（依券名去重，保留最新一筆的資料）
  const templateMap = {};
  for (const c of (couponsData.coupons || [])) {
    if (!templateMap[c.title]) {
      templateMap[c.title] = { type: c.type || 'gift', title: c.title, description: c.description || '', discount: c.discount || 0 };
    }
  }
  couponTemplates = Object.values(templateMap);

  const templateOptions = couponTemplates.map((t, i) => {
    const label = t.type === 'gift' ? '🎁' : '💰';
    return `<option value="${i}">${label} ${t.title}</option>`;
  }).join('');

  const tagOptions = allTags.map(t => `<option value="tag:${t.name}">🏷️ ${t.name}（${t.member_count} 人）</option>`).join('');
  const monthOptions = Array.from({length: 12}, (_, i) => {
    const m = i + 1;
    return `<option value="birthday:${m}">🎂 ${m} 月壽星</option>`;
  }).join('');

  document.getElementById('tab-content').innerHTML = `
    <div class="section" style="padding-top:20px;">
      <div class="card">
        <h2>🎫 發送優惠券</h2>
        ${couponTemplates.length > 0 ? `
          <label style="font-size:13px;color:#666;display:block;margin-bottom:5px;">📋 快速選用歷史券</label>
          <div style="display:flex;gap:8px;margin-bottom:15px;">
            <select id="c-template" style="flex:1;margin:0;">
              <option value="">— 自訂新券 —</option>
              ${templateOptions}
            </select>
            <button class="btn btn-success btn-sm" style="width:auto;padding:8px 16px;margin:0;" onclick="applyTemplate()">帶入</button>
          </div>
        ` : ''}
        <label style="font-size:13px;color:#666;display:block;margin-bottom:5px;">券類型</label>
        <select id="c-type">
          <option value="gift">🎁 贈品券（免費兌換品項）</option>
          <option value="discount">💰 折抵券（折抵金額）</option>
        </select>
        <label style="font-size:13px;color:#666;display:block;margin-bottom:5px;">券名稱</label>
        <input type="text" id="c-title" placeholder="例：秋季限定贈品券">
        <label style="font-size:13px;color:#666;display:block;margin-bottom:5px;">說明</label>
        <input type="text" id="c-desc" placeholder="例：消費滿 $150 送招牌小菜一份">
        <label style="font-size:13px;color:#666;display:block;margin-bottom:5px;">折抵金額（贈品券填 0）</label>
        <input type="number" id="c-discount" placeholder="0" value="0">
        <label style="font-size:13px;color:#666;display:block;margin-bottom:5px;">有效天數</label>
        <input type="number" id="c-days" placeholder="90" value="90">
        <label style="font-size:13px;color:#666;display:block;margin-bottom:5px;">發送對象</label>
        <select id="c-target" onchange="togglePhoneInput()">
          <option value="all">📢 全部會員</option>
          <option value="phone">📱 指定會員（手機號碼）</option>
          ${tagOptions}
          ${monthOptions}
        </select>
        <div id="phone-input-wrap" style="display:none;">
          <input type="tel" id="c-phone" placeholder="輸入會員手機號碼" maxlength="10" inputmode="numeric">
        </div>
        <button class="btn btn-primary" onclick="sendCoupon()">發送優惠券</button>
        <div class="result" id="send-result"></div>
      </div>
    </div>
  `;
}

function togglePhoneInput() {
  const val = document.getElementById('c-target').value;
  document.getElementById('phone-input-wrap').style.display = val === 'phone' ? 'block' : 'none';
}

function applyTemplate() {
  const select = document.getElementById('c-template');
  const idx = select.value;
  if (idx === '') return;
  const t = couponTemplates[parseInt(idx)];
  document.getElementById('c-type').value = t.type || 'gift';
  document.getElementById('c-title').value = t.title;
  document.getElementById('c-desc').value = t.description;
  document.getElementById('c-discount').value = t.discount || 0;
}

async function sendCoupon() {
  const type = document.getElementById('c-type').value;
  const title = document.getElementById('c-title').value;
  const desc = document.getElementById('c-desc').value;
  const discount = parseInt(document.getElementById('c-discount').value) || 0;
  const days = parseInt(document.getElementById('c-days').value) || 90;
  const targetVal = document.getElementById('c-target').value;

  if (!title) { alert('請輸入券名稱'); return; }

  let target;
  let targetLabel;
  if (targetVal === 'all') {
    target = 'all';
    targetLabel = '全部會員';
  } else if (targetVal === 'phone') {
    const phone = (document.getElementById('c-phone').value || '').trim();
    if (!phone) { alert('請輸入手機號碼'); return; }
    target = { phone };
    targetLabel = `手機 ${phone}`;
  } else if (targetVal.startsWith('tag:')) {
    const tagName = targetVal.substring(4);
    target = { tag: tagName };
    targetLabel = `標籤「${tagName}」`;
  } else if (targetVal.startsWith('birthday:')) {
    const month = parseInt(targetVal.substring(9));
    target = { birthday_month: month };
    targetLabel = `${month} 月壽星`;
  }

  if (!confirm(`確定發送「${title}」給 ${targetLabel}？`)) return;

  const res = await fetch(`${API}/api/admin/send-coupon`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type, title, description: desc, discount, target, expires_days: days })
  });
  const data = await res.json();
  const el = document.getElementById('send-result');
  el.style.display = 'block';
  if (data.success) {
    el.className = 'result success';
    el.innerHTML = `✅ 成功發送給 ${data.sent} 位會員！`;
  } else {
    el.className = 'result error';
    el.innerHTML = `❌ 發送失敗：${data.error}`;

async function createCampaign() {
  const title = document.getElementById('sc-title').value;
  const description = document.getElementById('sc-desc').value;
  const stamp_goal = parseInt(document.getElementById('sc-goal').value);
  const icon = document.getElementById('sc-icon').value;

  const reward_description = document.getElementById('sc-reward-desc').value;
  const start_date = document.getElementById('sc-start').value;
  const end_date = document.getElementById('sc-end').value;
  const reward_expires_days = parseInt(document.getElementById('sc-reward-days').value) || 30;
  const color = document.getElementById('sc-color').value;

  if (!title || !stamp_goal || !start_date || !end_date) {
    alert('請填寫活動名稱、集章目標、開始/結束日期');

async function createScratchCampaign() {
  const title = document.getElementById('scratch-title').value.trim();
  const description = document.getElementById('scratch-desc').value.trim();
  const start_date = document.getElementById('scratch-start').value;
  const end_date = document.getElementById('scratch-end').value;
  const max_plays = parseInt(document.getElementById('scratch-max').value) || 1;

  if (!title || !start_date || !end_date) {
    alert('請填寫活動名稱、開始/結束日期');
    return;
  }

  const prizeEls = document.querySelectorAll('[id^="prize-row-"]');
  const prizes = [];
  let totalOdds = 0;

  prizeEls.forEach(el => {
    const idx = el.id.split('-')[2];
    const name = document.getElementById(`pz-name-${idx}`)?.value?.trim();
    const odds = parseInt(document.getElementById(`pz-odds-${idx}`)?.value) || 0;
    if (!name || !odds) return;

    totalOdds += odds;
    prizes.push({
      name,
      prize_type: 'coupon',
      coupon_type: 'gift',
      coupon_title: document.getElementById(`pz-coupon-title-${idx}`)?.value?.trim() || name,
      coupon_description: document.getElementById(`pz-coupon-desc-${idx}`)?.value?.trim() || '',
      coupon_discount: parseInt(document.getElementById(`pz-discount-${idx}`)?.value) || 0,
      coupon_expires_days: parseInt(document.getElementById(`pz-days-${idx}`)?.value) || 30,
      odds,
      quantity_limit: parseInt(document.getElementById(`pz-limit-${idx}`)?.value ?? -1)
    });
  });

  if (prizes.length === 0) {
    alert('請至少設定一個獎項');
    return;
  }
  if (totalOdds > 100) {
    alert(`中獎率合計 ${totalOdds}% 超過 100%，請調整`);
    return;
  }

  const res = await fetch(`${API}/api/admin/scratch-campaign`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, description, trigger_type: 'manual', max_plays, start_date, end_date, prizes })
  });
  const data = await res.json();
  const el = document.getElementById('scratch-result');
  el.style.display = 'block';

  if (data.success) {
    el.className = 'result success';
    el.innerHTML = '✅ 刮刮卡活動建立成功！';
    setTimeout(() => loadScratchCampaigns(), 1000);
  } else {
    el.className = 'result error';
    el.innerHTML = `❌ 建立失敗：${data.error}`;
  }
}

async function giveScratchChance(campaignId) {
  const targetVal = document.getElementById(`scratch-give-target-${campaignId}`).value;
  let target;
  let label;

  if (targetVal === 'all') {
    target = 'all';
    label = '全部會員';
  } else if (targetVal === 'phone') {
    const phone = document.getElementById(`scratch-give-phone-${campaignId}`).value.trim();
    if (!phone) { alert('請輸入手機號碼'); return; }
    target = { phone };
    label = `手機 ${phone}`;
  } else if (targetVal.startsWith('tag:')) {
    const tagName = targetVal.substring(4);
    target = { tag: tagName };
    label = `標籤「${tagName}」`;
  } else {
    alert('請選擇發放對象');
    return;
  }

  if (!confirm(`確定發放刮刮卡機會給 ${label}？`)) return;

  const res = await fetch(`${API}/api/admin/scratch-give`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ campaign_id: campaignId, target })
  });
  const data = await res.json();

  if (data.success) {
    alert(`✅ 成功發放給 ${data.given} 位會員！`);
    await loadScratchCampaigns();
  } else {
    alert(`❌ 發放失敗：${data.error}`);
  }
}

async function endScratchCampaign(id, title) {
  if (!confirm(`確定結束「${title}」？結束後無法恢復`)) return;
  await fetch(`${API}/api/admin/scratch-campaign/end`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ campaign_id: id })
  });
  await loadScratchCampaigns();
}

    <input type="text" id="wpz-coupon-title-${idx}" placeholder="券名稱（預設同獎品名稱）" style="margin-bottom:6px;">
    <input type="text" id="wpz-coupon-desc-${idx}" placeholder="券說明" style="margin-bottom:6px;">
    <div class="form-row">
      <div>
        <label style="font-size:11px;color:#999">折抵金額（贈品填 0）</label>
        <input type="number" id="wpz-discount-${idx}" value="0">
      </div>
      <div>
        <label style="font-size:11px;color:#999">券有效天數</label>
        <input type="number" id="wpz-days-${idx}" value="30">
      </div>
    </div>
  `;
  document.getElementById('wheel-prize-rows').appendChild(div);
}

async function createWheelCampaign() {
  const title = document.getElementById('wheel-title').value.trim();
  const description = document.getElementById('wheel-desc').value.trim();
  const start_date = document.getElementById('wheel-start').value;
  const end_date = document.getElementById('wheel-end').value;
  const max_plays = parseInt(document.getElementById('wheel-max').value) || 1;

  if (!title || !start_date || !end_date) {
    alert('請填寫活動名稱、開始/結束日期');
    return;
  }

  const prizeEls = document.querySelectorAll('[id^="wheel-prize-row-"]');
  const prizes = [];
  let totalOdds = 0;

  prizeEls.forEach(el => {
    const idx = el.id.split('-')[3];
    const name = document.getElementById(`wpz-name-${idx}`)?.value?.trim();
    const odds = parseInt(document.getElementById(`wpz-odds-${idx}`)?.value) || 0;
    if (!name || !odds) return;

    totalOdds += odds;
    prizes.push({
      name,
      prize_type: 'coupon',
      coupon_type: 'gift',
      coupon_title: document.getElementById(`wpz-coupon-title-${idx}`)?.value?.trim() || name,
      coupon_description: document.getElementById(`wpz-coupon-desc-${idx}`)?.value?.trim() || '',
      coupon_discount: parseInt(document.getElementById(`wpz-discount-${idx}`)?.value) || 0,
      coupon_expires_days: parseInt(document.getElementById(`wpz-days-${idx}`)?.value) || 30,
      odds,
      quantity_limit: parseInt(document.getElementById(`wpz-limit-${idx}`)?.value ?? -1)
    });
  });

  if (prizes.length === 0) {
    alert('請至少設定一個獎項');
    return;
  }
  if (prizes.length > 8) {
    alert('轉盤最多 8 格獎項，請刪減');
    return;
  }
  if (totalOdds > 100) {
    alert(`中獎率合計 ${totalOdds}% 超過 100%，請調整`);
    return;
  }

  const res = await fetch(`${API}/api/admin/wheel-campaign`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, description, trigger_type: 'manual', max_plays, start_date, end_date, prizes })
  });
  const data = await res.json();
  const el = document.getElementById('wheel-result');
  el.style.display = 'block';

  if (data.success) {
    el.className = 'result success';
    el.innerHTML = '✅ 轉盤活動建立成功！';
    setTimeout(() => loadWheelCampaigns(), 1000);
  } else {
    el.className = 'result error';
    el.innerHTML = `❌ 建立失敗：${data.error}`;
  }
}

async function giveWheelChance(campaignId) {
  const targetVal = document.getElementById(`wheel-give-target-${campaignId}`).value;
  let target;
  let label;

  if (targetVal === 'all') {
    target = 'all';
    label = '全部會員';
  } else if (targetVal === 'phone') {
    const phone = document.getElementById(`wheel-give-phone-${campaignId}`).value.trim();
    if (!phone) { alert('請輸入手機號碼'); return; }
    target = { phone };
    label = `手機 ${phone}`;
  } else if (targetVal.startsWith('tag:')) {
    const tagName = targetVal.substring(4);
    target = { tag: tagName };
    label = `標籤「${tagName}」`;
  } else {
    alert('請選擇發放對象');
    return;
  }

  if (!confirm(`確定發放轉盤機會給 ${label}？`)) return;

  const res = await fetch(`${API}/api/admin/wheel-give`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ campaign_id: campaignId, target })
  });
  const data = await res.json();

  if (data.success) {
    alert(`✅ 成功發放給 ${data.given} 位會員！`);
    await loadWheelCampaigns();
  } else {
    alert(`❌ 發放失敗：${data.error}`);
  }
}

async function endWheelCampaign(id, title) {
  if (!confirm(`確定結束「${title}」？結束後無法恢復`)) return;
  await fetch(`${API}/api/admin/wheel-campaign/end`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ campaign_id: id })
  });
  await loadWheelCampaigns();
}

// ── 券紀錄 ──

let allCoupons = [];

async function loadCoupons() {
  document.getElementById('tab-content').innerHTML = '<div class="loading">載入中...</div>';
  const res = await fetch(`${API}/api/admin/coupons`);
  const data = await res.json();
  allCoupons = data.coupons || [];
  renderCoupons();
}

function renderCoupons() {
  const statusFilter = document.getElementById('filter-status')?.value || 'all';
  const nameFilter = document.getElementById('filter-name')?.value || 'all';
  const search = (document.getElementById('filter-search')?.value || '').trim().toLowerCase();

  let filtered = allCoupons;

  if (statusFilter !== 'all') {
    filtered = filtered.filter(c => {
      if (statusFilter === 'expired' && c.status === 'active' && new Date(c.expires_at) < new Date()) return true;
      return c.status === statusFilter;
    });
  }

  if (nameFilter !== 'all') {
    filtered = filtered.filter(c => c.title === nameFilter);
  }

  if (search) {
    filtered = filtered.filter(c =>
      (c.name || '').toLowerCase().includes(search) ||
      (c.phone || '').includes(search) ||
      (c.code || '').includes(search)
    );
  }

  // 統計
  const total = allCoupons.length;
  const activeCount = allCoupons.filter(c => c.status === 'active').length;
  const usedCount = allCoupons.filter(c => c.status === 'used').length;
  const expiredCount = allCoupons.filter(c => c.status === 'expired').length;

  // 券種列表
  const couponNames = [...new Set(allCoupons.map(c => c.title))];
  const nameOptions = couponNames.map(n => `<option value="${n}" ${nameFilter === n ? 'selected' : ''}>${n}</option>`).join('');

  const couponHTML = filtered.map(c => {
    const isGift = c.type === 'gift' || c.discount === 0;
    const statusText = c.status === 'active' ? '未使用' : c.status === 'used' ? '已核銷' : '已過期';
    const statusClass = c.status === 'active' ? 'badge-active' : c.status === 'used' ? 'badge-used' : 'badge-expired';
    return `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px;margin-bottom:8px;background:${c.status === 'used' ? '#fafafa' : 'white'};border-radius:10px;border:1px solid #f0f0f0;">
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <span style="font-size:14px;font-weight:bold;">${c.title}</span>
          <span style="font-size:11px;padding:2px 8px;border-radius:8px;background:${isGift ? '#fff3e0' : '#e3f2fd'};color:${isGift ? '#e65100' : '#1565c0'};">${isGift ? '贈品' : 'NT$' + c.discount}</span>
        </div>
        <div style="font-size:12px;color:#999;margin-top:4px;">${c.name || '未命名'} ｜ ${c.phone || ''}</div>
        <div style="font-size:11px;color:#bbb;margin-top:2px;">碼 ${c.code} ｜ 效期 ${new Date(c.expires_at).toLocaleDateString('zh-TW')}${c.status === 'used' ? ` ｜ 核銷 ${new Date(c.used_at).toLocaleDateString('zh-TW')} ${c.used_store || ''} ${c.used_by || ''}` : ''}</div>
      </div>
      <span class="badge ${statusClass}" style="white-space:nowrap;margin-left:8px;">${statusText}</span>
    </div>`;
  }).join('');

  document.getElementById('tab-content').innerHTML = `
    <div class="stats-grid" style="padding-bottom:0;">
      <div class="stat-card"><div class="num">${total}</div><div class="label">總券數</div></div>
      <div class="stat-card"><div class="num" style="color:#27ae60">${activeCount}</div><div class="label">未使用</div></div>
      <div class="stat-card"><div class="num" style="color:#999">${usedCount}</div><div class="label">已核銷</div></div>
      <div class="stat-card"><div class="num" style="color:#e74c3c">${expiredCount}</div><div class="label">已過期</div></div>
    </div>
    <div class="section">
      <div class="card" style="padding:12px;">
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <select id="filter-status" onchange="renderCoupons()" style="width:auto;flex:1;min-width:80px;margin:0;font-size:12px;padding:8px;">
            <option value="all" ${statusFilter === 'all' ? 'selected' : ''}>全部狀態</option>
            <option value="active" ${statusFilter === 'active' ? 'selected' : ''}>未使用</option>
            <option value="used" ${statusFilter === 'used' ? 'selected' : ''}>已核銷</option>
            <option value="expired" ${statusFilter === 'expired' ? 'selected' : ''}>已過期</option>
          </select>
          <select id="filter-name" onchange="renderCoupons()" style="width:auto;flex:1;min-width:80px;margin:0;font-size:12px;padding:8px;">
            <option value="all">全部券種</option>
            ${nameOptions}
          </select>
          <input type="text" id="filter-search" placeholder="搜尋姓名/手機/券碼" oninput="renderCoupons()" style="flex:2;min-width:120px;margin:0;font-size:12px;padding:8px;">
        </div>
      </div>
      <div style="font-size:12px;color:#999;margin-bottom:10px;">顯示 ${filtered.length} / ${total} 筆</div>
      ${couponHTML || '<div class="card" style="text-align:center;color:#999;padding:30px;">無符合條件的券</div>'}
    </div>
  `;
}

// ── 匯出 ──

function showExport() {
  document.getElementById('tab-content').innerHTML = `
    <div class="section" style="padding-top:20px;">
      <div class="card">
        <h2>匯出資料</h2>
        <button class="btn btn-success" onclick="exportMembers()">📥 匯出會員名單 CSV</button>
        <button class="btn btn-primary" onclick="exportCoupons()">📥 匯出優惠券紀錄 CSV</button>
      </div>
    </div>
  `;
}

async function exportMembers() {
  const res = await fetch(`${API}/api/admin/members`);
  const data = await res.json();
  const members = data.members || [];
  const csv = [
    ['姓名','手機','生日','標籤','加入日期'].join(','),
    ...members.map(m => [
      m.name || '', m.phone || '', m.birthday || '',
      (m.tags || []).join('/'),
      new Date(m.created_at).toLocaleDateString('zh-TW')
    ].join(','))
  ].join('\n');
  downloadCSV(csv, `麻媽家會員_${today()}.csv`);
}

async function exportCoupons() {
  const res = await fetch(`${API}/api/admin/coupons`);
  const data = await res.json();
  const coupons = data.coupons || [];
  const csv = [
    ['會員','手機','券名稱','類型','折抵金額','核銷碼','狀態','到期日','核銷時間','核銷門店'].join(','),
    ...coupons.map(c => [
      c.name || '', c.phone || '', c.title, c.type || '', c.discount, c.code,
      c.status === 'active' ? '未使用' : c.status === 'used' ? '已使用' : '已過期',
      new Date(c.expires_at).toLocaleDateString('zh-TW'),
      c.used_at ? new Date(c.used_at).toLocaleDateString('zh-TW') : '',
      c.used_store || ''
    ].join(','))
  ].join('\n');
  downloadCSV(csv, `麻媽家優惠券_${today()}.csv`);
}

function downloadCSV(csv, filename) {
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
}

function today() {
  return new Date().toLocaleDateString('zh-TW').replace(/\//g, '-');
}

showLogin();
