<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麻媽家 店員後台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Noto Sans TC', sans-serif; background: #fff8f2; min-height: 100vh; }
  .header { background: linear-gradient(135deg, #cc6600, #FF8200); color: white; padding: 20px; text-align: center; }
  .header h1 { font-size: 20px; }
  .header .staff-info { font-size: 13px; opacity: 0.8; margin-top: 5px; }
  .section { padding: 20px; }
  .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .card h2 { font-size: 16px; color: #333; margin-bottom: 15px; }
  input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; margin-bottom: 10px; }
  select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; margin-bottom: 10px; background: white; }
  .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; color: white; margin-bottom: 8px; }
  .btn-primary { background: #FF8200; }
  .btn-success { background: #27ae60; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .member-info { background: #fff8f2; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
  .member-info .name { font-size: 18px; font-weight: bold; color: #333; }
  .member-info .label { font-size: 13px; color: #999; }
  .result { padding: 15px; border-radius: 8px; margin-top: 10px; text-align: center; font-size: 16px; font-weight: bold; display: none; }
  .result.success { background: #d4edda; color: #155724; }
  .result.error { background: #f8d7da; color: #721c24; }
  .login-form { max-width: 400px; margin: 50px auto; }
  .tab { display: flex; margin-bottom: 20px; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .tab-btn { flex: 1; padding: 14px 5px; border: none; background: white; cursor: pointer; font-size: 13px; }
  .tab-btn.active { background: #FF8200; color: white; }
  .coupon-result { background: #fff3e0; border: 2px solid #FF8200; border-radius: 12px; padding: 20px; text-align: center; margin-top: 15px; display: none; }
  .coupon-result .coupon-title { font-size: 20px; font-weight: bold; color: #FF8200; margin-bottom: 8px; }
  .coupon-result .coupon-desc { font-size: 14px; color: #666; margin-top: 8px; }
  .stamp-progress { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 15px 0; }
  .stamp-dot { width: 32px; height: 32px; border-radius: 50%; border: 2px dashed #ccc; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #ccc; }
  .stamp-dot.filled { border: 2px solid #FF8200; background: #FFF3E8; color: #FF8200; }
  .campaign-select { background: #fff8f2; border-radius: 8px; padding: 12px; margin-bottom: 12px; cursor: pointer; border: 2px solid transparent; }
  .campaign-select.selected { border-color: #FF8200; }
  .campaign-select .c-title { font-weight: bold; font-size: 14px; }
  .campaign-select .c-info { font-size: 12px; color: #999; margin-top: 4px; }
</style>
</head>
<body>

<div id="app"><div style="text-align:center;padding:50px;color:#999">載入中...</div></div>

<script>
const API = 'https://mamaja-member-api.renechen188.workers.dev';

let currentStaff = null;
let currentMember = null;
let activeCampaigns = [];
let selectedCampaignId = null;

function showLogin() {
  document.getElementById('app').innerHTML = `
    <div class="header"><h1>麻媽家 店員後台</h1></div>
    <div class="section">
      <div class="login-form card">
        <h2>店員登入</h2>
        <input type="text" id="username" placeholder="帳號">
        <input type="password" id="password" placeholder="密碼">
        <button class="btn btn-primary" onclick="login()">登入</button>
        <div id="login-error" style="color:#e74c3c;text-align:center;margin-top:10px;display:none">帳號或密碼錯誤</div>
      </div>
    </div>
  `;
}

async function login() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const res = await fetch(`${API}/api/staff/login`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });
  const data = await res.json();
  if (data.success) {
    currentStaff = data.staff;
    showMain();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}

function showMain() {
  document.getElementById('app').innerHTML = `
    <div class="header">
      <h1>麻媽家 店員後台</h1>
      <div class="staff-info">${currentStaff.name}｜${currentStaff.store}</div>
    </div>
    <div class="section">
      <div class="tab">
        <button class="tab-btn active" onclick="switchTab('coupon')" id="tab-coupon">🎫 核銷券</button>
        <button class="tab-btn" onclick="switchTab('stamp')" id="tab-stamp">🎯 蓋章</button>
        <button class="tab-btn" onclick="switchTab('query')" id="tab-query">🔍 查詢</button>
      </div>
      <div id="tab-content"></div>
    </div>
  `;
  showCouponTab();
}

function switchTab(tab) {
  currentMember = null;
  selectedCampaignId = null;
  ['coupon','stamp','query'].forEach(t => {
    document.getElementById(`tab-${t}`).className = 'tab-btn' + (t === tab ? ' active' : '');
  });
  if (tab === 'coupon') showCouponTab();
  if (tab === 'stamp') showStampTab();
  if (tab === 'query') showQueryTab();
}

// ── 核銷券 ──

function showCouponTab() {
  document.getElementById('tab-content').innerHTML = `
    <div class="card">
      <h2>🎫 核銷優惠券</h2>
      <p style="font-size:13px;color:#999;margin-bottom:15px;">請客人出示會員卡上的核銷碼</p>
      <input type="text" id="coupon-code" placeholder="輸入核銷碼（6碼數字）" maxlength="6" inputmode="numeric" style="letter-spacing:3px;font-size:18px;text-align:center;">
      <button class="btn btn-primary" onclick="redeemCoupon()">確認核銷</button>
      <div class="coupon-result" id="coupon-result">
        <div class="coupon-title" id="coupon-title"></div>
        <div class="coupon-desc" id="coupon-desc"></div>
        <div style="margin-top:15px;font-size:13px;color:#27ae60;font-weight:bold">✅ 核銷成功！</div>
      </div>
      <div class="result error" id="coupon-error"></div>
    </div>
  `;
}

async function redeemCoupon() {
  const code = document.getElementById('coupon-code').value;
  if (!code || code.length < 6) { alert('請輸入完整核銷碼'); return; }

  const res = await fetch(`${API}/api/coupon/redeem`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code, staff: currentStaff.name, store: currentStaff.store })
  });
  const data = await res.json();

  const resultEl = document.getElementById('coupon-result');
  const errorEl = document.getElementById('coupon-error');

  if (data.success) {
    document.getElementById('coupon-title').textContent = data.coupon.title;
    document.getElementById('coupon-desc').textContent = data.coupon.description || '';
    resultEl.style.display = 'block';
    errorEl.style.display = 'none';
    document.getElementById('coupon-code').value = '';
  } else {
    errorEl.textContent = data.error;
    errorEl.style.display = 'block';
    resultEl.style.display = 'none';
  }
}

// ── 蓋章 ──

async function showStampTab() {
  document.getElementById('tab-content').innerHTML = `
    <div class="card">
      <h2>🎯 集章蓋章</h2>
      <input type="tel" id="stamp-phone" placeholder="輸入客人手機號碼" maxlength="10">
      <button class="btn btn-primary" onclick="lookupForStamp()">查詢會員</button>
    </div>
    <div id="stamp-area"></div>
  `;

  try {
    const res = await fetch(`${API}/api/stamp/active`);
    const data = await res.json();
    activeCampaigns = data.campaigns || [];
  } catch (e) {
    activeCampaigns = [];
  }
}

async function lookupForStamp() {
  const phone = document.getElementById('stamp-phone').value;
  if (!phone) return alert('請輸入手機號碼');

  const res = await fetch(`${API}/api/member/by-phone?phone=${phone}`);
  const data = await res.json();

  if (data.error) {
    document.getElementById('stamp-area').innerHTML = `
      <div class="card" style="text-align:center;color:#e74c3c">找不到此會員，請確認手機號碼</div>`;
    return;
  }

  currentMember = data.member;

  if (activeCampaigns.length === 0) {
    document.getElementById('stamp-area').innerHTML = `
      <div class="card" style="text-align:center;color:#999">目前沒有進行中的集章活動</div>`;
    return;
  }

  const memberStampsRes = await fetch(`${API}/api/stamp/active?line_id=${encodeURIComponent(currentMember.line_id)}`);
  const memberStampsData = await memberStampsRes.json();
  const campaignsWithProgress = memberStampsData.campaigns || activeCampaigns;

  let html = `<div class="card">
    <div class="member-info">
      <div class="label">會員</div>
      <div class="name">${currentMember.name || currentMember.phone}</div>
    </div>
    <h2>選擇活動蓋章</h2>`;

  campaignsWithProgress.forEach(c => {
    const myStamps = c.my_stamps || 0;
    const completed = myStamps >= c.stamp_goal;
    let dotsHTML = '';
    for (let i = 1; i <= c.stamp_goal; i++) {
      const filled = i <= myStamps ? ' filled' : '';
      dotsHTML += `<div class="stamp-dot${filled}">${i <= myStamps ? '✓' : i}</div>`;
    }

    html += `
    <div class="campaign-select" id="cs-${c.id}" onclick="selectCampaign(${c.id})">
      <div class="c-title">${c.icon || '🍲'} ${c.title}</div>
      <div class="c-info">進度 ${myStamps}/${c.stamp_goal}${completed ? ' ✅ 已集滿' : ''}</div>
      <div class="stamp-progress">${dotsHTML}</div>
    </div>`;
  });

  html += `
    <button class="btn btn-success" id="stamp-btn" onclick="doStamp()" disabled>請先選擇活動</button>
    <div class="result" id="stamp-result"></div>
  </div>`;

  document.getElementById('stamp-area').innerHTML = html;
}

function selectCampaign(id) {
  selectedCampaignId = id;
  document.querySelectorAll('.campaign-select').forEach(el => el.classList.remove('selected'));
  document.getElementById(`cs-${id}`).classList.add('selected');
  const btn = document.getElementById('stamp-btn');
  btn.disabled = false;
  btn.textContent = '確認蓋章';
}

async function doStamp() {
  if (!selectedCampaignId || !currentMember) return;
  const btn = document.getElementById('stamp-btn');
  btn.disabled = true;
  btn.textContent = '蓋章中...';

  const res = await fetch(`${API}/api/stamp/add`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      phone: currentMember.phone,
      campaign_id: selectedCampaignId,
      staff: currentStaff.name,
      store: currentStaff.store
    })
  });
  const data = await res.json();
  const el = document.getElementById('stamp-result');
  el.style.display = 'block';

  if (data.success) {
    el.className = 'result success';
    let msg = `✅ 蓋章成功！${data.member_name || ''} ${data.stamps}/${data.goal}`;
    if (data.completed && data.reward) {
      msg += `\n🎉 集滿了！獎勵券「${data.reward.title}」已自動發送`;
    }
    el.innerHTML = msg.replace('\n', '<br>');
    lookupForStamp();
  } else {
    el.className = 'result error';
    el.innerHTML = data.error;
    btn.disabled = false;
    btn.textContent = '確認蓋章';
  }
}

// ── 查詢 ──

function showQueryTab() {
  document.getElementById('tab-content').innerHTML = `
    <div class="card">
      <h2>查詢會員</h2>
      <input type="tel" id="search-phone" placeholder="輸入手機號碼" maxlength="10">
      <button class="btn btn-primary" onclick="searchMember()">查詢</button>
    </div>
    <div id="member-result"></div>
  `;
}

async function searchMember() {
  const phone = document.getElementById('search-phone').value;
  if (!phone) return alert('請輸入手機號碼');

  const res = await fetch(`${API}/api/member/by-phone?phone=${phone}`);
  const data = await res.json();

  if (data.error) {
    document.getElementById('member-result').innerHTML = `
      <div class="card" style="text-align:center;color:#e74c3c">找不到此會員</div>`;
    return;
  }

  currentMember = data.member;
  const activeCoupons = (data.coupons || []).filter(c => c.status === 'active');
  const tags = data.tags || [];
  const tagsHTML = tags.length > 0
    ? tags.map(t => `<span style="display:inline-block;background:#FFF3E8;color:#FF8200;font-size:11px;padding:2px 8px;border-radius:10px;margin-right:4px;">${t}</span>`).join('')
    : '<span style="color:#999;font-size:12px">無標籤</span>';

  document.getElementById('member-result').innerHTML = `
    <div class="card">
      <div class="member-info">
        <div class="name">${currentMember.name || '未命名'}</div>
        <div class="label">${currentMember.phone || ''} ｜ 可用券 ${activeCoupons.length} 張</div>
        <div style="margin-top:8px">${tagsHTML}</div>
      </div>
      <div style="font-size:13px;color:#999;">
        <div>生日：${currentMember.birthday || '未填寫'}</div>
        <div>加入：${new Date(currentMember.created_at).toLocaleDateString('zh-TW')}</div>
      </div>
    </div>
  `;
}

showLogin();
</script>
</body>
</html>
